services:
  # MongoDB 6.0+ metadata tier (SRS §3.10, §3.6.1; SAD §9, constraint R8).
  # Audit-only: model registrations, analysis records, audio-sample references
  # and accent-bias reports. Never holds audio bytes or tensors (C4/SR4).
  # Optional for local development - with MONGO_URL unset every write-through
  # degrades silently, so inference never depends on it (SAD §11.1).
  mongo:
    image: mongo:6
    container_name: lit-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    # Named volume so the audit tier survives `docker compose down`; use
    # `docker compose down -v` to reset. Matches the standalone
    # `docker run --name lit-mongo` alternative in the README.
    volumes:
      - lit-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: lit-redis
    # 2 GB per SRS 3.4.3 ("Redis cache | 2 GB cap (configurable) | LRU eviction;
    # persistence disabled since every entry is recomputable"). This was 256 MB,
    # eight times under the committed budget, which a single load-test run
    # exhausted: saliency payloads carry a full base spectrogram plus an
    # attribution matrix, so a handful of them fill it. When it filled, writes
    # started failing with "OutOfMemoryError: command not allowed when used
    # memory > 'maxmemory'" - and because RQ registers and heartbeats workers
    # through the same Redis, that killed the workers rather than merely missing
    # a cache entry. LRU eviction cannot save a write larger than what it can
    # free in one pass.
    #
    # volatile-lru, not allkeys-lru: RQ's queue lists, queue registry and the
    # per-family worker locks live in this same Redis, and allkeys-lru evicted
    # them when the cache filled - queued jobs vanished and a live worker lost
    # its lock. volatile-* only evicts keys with a TTL (every cache, progress
    # and session key has one; RQ's queues do not). See docker-compose.yml.
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "volatile-lru"]
    ports: 
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  lit-mongo-data:
