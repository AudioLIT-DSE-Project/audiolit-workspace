# Shared by every Python service below. Source is bind-mounted rather than
# COPYed so edits are live without a rebuild.
x-backend-base: &backend-base
  build: .
  image: audiolit-backend:local
  volumes:
    - .:/app
  working_dir: /app
  environment:
    HF_HOME: /app/.hf-cache

services:
  redis:
    image: redis:7-alpine
    container_name: lit-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-off commands, chiefly the test suite:
  #     docker compose run --rm backend pytest
  #
  # Deliberately has NO REDIS_URL and no `depends_on: redis`. settings.REDIS_URL
  # then falls back to redis://localhost:6379/0, which inside this container
  # reaches nothing — so the suite runs against conftest.py's fakeredis fixture
  # and cannot touch a live broker. That matters: health.py binds the redis
  # client by name (`from ...infrastructure.redis import redis`), bypassing that
  # fixture, and a *reachable* Redis during a test run is what LIT-229 records as
  # breaking 7 unrelated tests with "Event loop is closed". Do not add REDIS_URL
  # here until LIT-229 is fixed.
  backend:
    <<: *backend-base

  # The FastAPI gateway. Talks to the real broker.
  api:
    <<: *backend-base
    environment:
      HF_HOME: /app/.hf-cache
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # One worker per model family (SAD §6.1). Defaults to asr; override the family
  # per SAD C2's one-GPU-worker-per-family rule:
  #     docker compose run --rm worker python -m app.orchestration.worker ser
  worker:
    <<: *backend-base
    environment:
      HF_HOME: /app/.hf-cache
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.orchestration.worker", "asr"]
