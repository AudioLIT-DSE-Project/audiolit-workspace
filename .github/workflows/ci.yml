name: Workspace CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci
      - name: Run ESLint
        run: |
          cd Frontend
          npm run lint
      - name: Run Jest
        run: |
          cd Frontend
          npm test
      - name: Build Vite App
        run: |
          cd Frontend
          npm run build

  backend-test:
