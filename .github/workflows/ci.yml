name: Workspace CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci
      - name: Run ESLint
        run: |
          cd Frontend
          npm run lint
      - name: Build Vite App
        run: |
          cd Frontend
          npm run build

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          cd Backend
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx uvicorn
      - name: Run Pytest
        run: |
          cd Backend
          pytest

